name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# GITHUB_TOKEN needs write access to Pages; `id-token` is required by the
# deploy-pages action to prove the artifact came from this workflow run.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish rather than being killed,
# so a half-uploaded artifact can't become the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, so CI can't
      # silently pick up a newer transitive dependency than local dev has.
      - run: npm ci

      - name: Build static export
        env:
          # Switches next.config.js onto the /fitmaximgym base path.
          GITHUB_PAGES: 'true'
        run: npm run build

      # Without this, Pages runs the output through Jekyll, which strips any
      # directory beginning with an underscore — that would delete _next/ and
      # take every script and stylesheet with it.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
